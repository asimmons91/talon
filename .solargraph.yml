---
include:
  - Rakefile
  - Gemfile
  - "*.gemspec"
  - "./**/*.rb"
exclude:
  - spec/**/*
  - vendor/**/*
  - ".bundle/**/*"
require: []
domains: []
reporters:
  - rubocop
formatter:
  rubocop:
    cops: safe
    except: []
    only: []
    extra_args: []
type_checker:
  rules: {}
require_paths: []
plugins:
  - solargraph-dragonruby
max_files: 5000
